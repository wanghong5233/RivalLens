name: Secret Scan

# 见 docs/private/PITFALL-secret-leak-2026-06-02.md §1.5：
# 任何分支 push 都视同 secret 进入对象库；CI 必须在所有分支 push 与所有 PR 上跑。
on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan tracked files for secrets
        run: python scripts/scan_secrets.py --all-tracked
