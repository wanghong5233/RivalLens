id: 05_promoted_pricing_blocks_then_passes
description: Promoted pricing length rule blocks once and passes after writer redo.
setup:
  promoted_qa_rules:
    - rule_id: rule_pricing_retry_demo
      rule_yaml: |
        id: rule_pricing_retry_demo
        when:
          section_title_contains: ["Actionable"]
        require:
          section_content_min_chars: 120
        severity: blocking
        reject_to: writer
        message: "Writer must provide enough detail in pricing section."
  llm_profile: retry
input:
  user_query: "promoted QA rule should trigger one writer retry"
  competitors:
    - comp_cursor
    - comp_windsurf
  domain_hint: ai coding assistants
  reference_urls: []
  target_roles:
    - pm
assertions:
  final_qa_outcome: approved
  qa_rejection_count_gte: 1

