name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - wh/**

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan tracked files for secrets
        run: python scripts/scan_secrets.py --all-tracked
